<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager | Professional Inventory Solutions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts: Outfit for a premium sans-serif look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons for modern UI icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app">
        <!-- Navigation Header -->
        <header id="main-nav">
            <div class="nav-container">
                <div class="logo">
                    <span class="logo-text">Inventory Manager</span>
                </div>
                <nav class="nav-links-wrapper">
                    <ul class="nav-links">
                        <li><a href="#stock-tracking" class="nav-item active">Stock Tracking</a></li>
                        <li><a href="#alerts" class="nav-item">Alerts</a></li>
                        <li><a href="#dashboard" class="nav-item">Dashboard</a></li>
                        <li><a href="#order-history" class="nav-item">Order History</a></li>
                    </ul>
                </nav>
                <div class="user-profile" id="user-profile-btn">
                    <div class="profile-avatar-plain"></div>
                    <div id="profile-tooltip" class="profile-tooltip">Supplier User Profile</div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="content">
            <!-- Content will be dynamically loaded here by main.js -->
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}?v=2"></script>
</body>
</html>
